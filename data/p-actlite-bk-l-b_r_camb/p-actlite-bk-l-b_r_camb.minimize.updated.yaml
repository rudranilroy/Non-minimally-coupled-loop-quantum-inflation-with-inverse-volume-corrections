params:
  ombh2:
    prior:
      min: 0.017
      max: 0.027
    ref:
      dist: norm
      loc: 0.02239
      scale: 0.0021
    proposal: 6.5e-05
    latex: \Omega_\mathrm{b}h^2
    renames:
    - omegabh2
  omch2:
    prior:
      min: 0.09
      max: 0.15
    ref:
      dist: norm
      loc: 0.12
      scale: 0.026
    proposal: 0.0011
    latex: \Omega_\mathrm{c}h^2
    renames:
    - omegach2
  cosmomc_theta:
